<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="Landing page responsive neo-brutalista.">
  <title>Marca — Landing</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>

  <header class="site-header">
    <nav class="navbar" aria-label="Navegación principal">
      <a href="#hero" class="logo">Marca</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menú</button>
      <ul class="nav-links" id="nav-links">
        <li><a href="#features">Ventajas</a></li>
        <li><a href="#pricing">Precios</a></li>
        <li><a href="#testimonials">Opiniones</a></li>
        <li><a href="#cta">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section id="hero" class="hero">
      <div class="hero-box">
        <h1>Hazlo simple.<br>Hazlo fuerte.</h1>
        <p>Una herramienta. Cero ruido.</p>
        <a href="#cta" class="btn btn-primary">Empezar</a>
      </div>
    </section>

    <section id="features" aria-labelledby="features-title">
      <h2 id="features-title">Ventajas</h2>
      <div class="card-grid" data-list="features" aria-busy="true"></div>
    </section>

    <section id="pricing" aria-labelledby="pricing-title">
      <h2 id="pricing-title">Precios</h2>
      <div class="card-grid" data-list="plans" aria-busy="true"></div>
    </section>

    <section id="testimonials" aria-labelledby="testimonials-title">
      <h2 id="testimonials-title">Opiniones</h2>
      <div class="card-grid" data-list="testimonials" aria-busy="true"></div>
    </section>

    <section id="cta" aria-labelledby="cta-title">
      <div class="cta-box">
        <h2 id="cta-title">¿Listo?</h2>
        <form class="cta-form" id="subscribe-form" novalidate>
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" autocomplete="email" inputmode="email" maxlength="254" required placeholder="tu@email.com" aria-describedby="form-msg">
          <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit" class="btn btn-primary">Suscribirme</button>
          <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Marca</p>
  </footer>
</body>
</html>
