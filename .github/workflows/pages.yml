name: Deploy Pages

# Builds _site/ (public files only) and publishes it to the gh-pages branch,
# which GitHub Pages serves. supabase/, test/, docs and configs never reach that branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build _site
        run: sh scripts/build.sh

      # Overwrites js/config.js with PUBLIC values from GitHub Secrets (if present).
      # Otherwise the repo's demo-mode config.js is published.
      - name: Generate config.js
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$FUNCTIONS_URL" ] && [ -n "$ANON_KEY" ]; then
            printf 'window.APP_CONFIG = { functionsUrl: "%s", anonKey: "%s" };\n' "$FUNCTIONS_URL" "$ANON_KEY" > _site/js/config.js
          fi

      # Orphan branch with a single commit: no growing history and no stale files.
      - name: Publish to gh-pages
        working-directory: _site
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
