name: Deploy Pages

# Builds _site/ (public files only) and publishes it with GitHub Pages.
# supabase/, test/, docs and configs never reach the published site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

      - name: Build _site
        run: sh scripts/build.sh

      # Overwrites js/config.js with PUBLIC values from GitHub Secrets (if present).
      # Otherwise the repo's demo-mode config.js is published.
      - name: Generate config.js
        env:
          FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$FUNCTIONS_URL" ] && [ -n "$ANON_KEY" ]; then
            printf 'window.APP_CONFIG = { functionsUrl: "%s", anonKey: "%s" };\n' "$FUNCTIONS_URL" "$ANON_KEY" > _site/js/config.js
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishes the artifact. Only this job can write, and only to Pages: no write access to
  # the repository's contents.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
